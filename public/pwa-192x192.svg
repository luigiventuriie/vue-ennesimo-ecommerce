<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Rounded square background with gradient -->
  <defs>
    <linearGradient id="bgGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4b5fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bgGrad192)"/>
  
  <!-- Shopping bag icon -->
  <g transform="translate(96, 96)">
    <!-- Bag body -->
    <path d="M -35 -15 L -30 35 C -30 40 -25 45 -20 45 L 20 45 C 25 45 30 40 30 35 L 35 -15 Z" 
          fill="#8b5cf6" stroke="#7c3aed" stroke-width="2"/>
    
    <!-- Bag handles -->
    <path d="M -20 -15 Q -20 -35 0 -35 Q 20 -35 20 -15" 
          fill="none" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Highlight -->
    <ellipse cx="-15" cy="0" rx="8" ry="12" fill="white" opacity="0.3"/>
  </g>
</svg>
