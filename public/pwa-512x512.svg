<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Rounded square background with gradient -->
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4b5fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)"/>
  
  <!-- Shopping bag icon (scaled up) -->
  <g transform="translate(256, 256)">
    <!-- Bag body -->
    <path d="M -95 -40 L -80 95 C -80 108 -68 120 -55 120 L 55 120 C 68 120 80 108 80 95 L 95 -40 Z" 
          fill="#8b5cf6" stroke="#7c3aed" stroke-width="5"/>
    
    <!-- Bag handles -->
    <path d="M -55 -40 Q -55 -95 0 -95 Q 55 -95 55 -40" 
          fill="none" stroke="#8b5cf6" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Highlight -->
    <ellipse cx="-40" cy="0" rx="22" ry="32" fill="white" opacity="0.3"/>
  </g>
</svg>
